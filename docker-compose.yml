services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml
      - ./backend/.env:/app/.env
      - backend_data:/app/data
    restart: unless-stopped
    environment:
      - GIN_MODE=release
      - SERVER_ENV=production
      - TEAMSPEAK_PASSWORD=${TEAMSPEAK_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TEAMSPEAK_SERVER_QUERY_APIKEY=${TEAMSPEAK_SERVER_QUERY_APIKEY}
      - TEAMSPEAK_SERVER_ADMIN_TOKEN=${TEAMSPEAK_SERVER_ADMIN_TOKEN}
      - TEAMSPEAK_USERNAME=${TEAMSPEAK_USERNAME}
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - teamspeak

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # 添加TeamSpeak服务
  teamspeak:
    image: teamspeak:latest
    ports:
      - "9987:9987/udp"
      - "10011:10011/tcp"
      - "30033:30033/tcp"
    volumes:
      - teamspeak_data:/var/ts3server
    environment:
      - TS3SERVER_LICENSE=accept
    restart: unless-stopped
    # 设置服务健康检查
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep 10011 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
  teamspeak_data:
