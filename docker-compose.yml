services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml
      - ./backend/.env:/app/.env
      - ./backend/data:/app/data
    restart: unless-stopped
    environment:
      - SERVER_ENV=production
      - TEAMSPEAK_PASSWORD=${TEAMSPEAK_PASSWORD}
  - TEAMSPEAK_HOST=${TEAMSPEAK_HOST:-host.docker.internal}
      - JWT_SECRET=${JWT_SECRET}
      - TEAMSPEAK_SERVER_QUERY_APIKEY=${TEAMSPEAK_SERVER_QUERY_APIKEY}
      - TEAMSPEAK_SERVER_ADMIN_TOKEN=${TEAMSPEAK_SERVER_ADMIN_TOKEN}
      - TEAMSPEAK_SERVER_ADMIN_USERNAME=${TEAMSPEAK_SERVER_ADMIN_USERNAME}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

volumes:
  redis_data:
  # backend_data removed in favour of a bind mount to ./backend/data
