# TeamSpeak 一键部署后端配置

server:
  port: "8080"
  env: "development"
  log_level: "debug"
  rate_limit:
    enabled: true
    rps: 100
    burst: 200
  auth:
    require_auth: true
    public_paths:
      - "/api/user/login"
      - "/api/user/register"
  cors:
    allowed_origins:
      - "*"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "*"
    expose_headers:
      - ""
    allow_credentials: false
  middleware:
    enable_access_log: true

database:
  driver: "sqlite"
  dsn: "data/teamspeak.db"
  max_idle_conns: 5
  max_open_conns: 10
  conn_max_lifetime: 1h
  auto_migrate: true

monitoring:
  addr: ":9090"
  collect_interval: 1m
  min_collection_interval: 1h
  system_sample_rate: 1
  business_sample_rate: 1
  max_history_size: 24
  performance:
    collection_delay: 5s
    inter_func_delay: 600s
    inner_func_delay: 10s
  redis:
    enabled: true
    addr: "redis:6379"
    password: ""
    db: 0

teamspeak:
  host: teamspeak  # 使用docker-compose服务名而不是localhost
  query_port: 10011
  virtual_server_port: 9987
  virtual_server_id: 1
  username: serveradmin
  # password 通过环境变量 TEAMSPEAK_PASSWORD 设置
  nickname: "Monitoring Bot"
  reconnect_max_retries: 3
  reconnect_initial_backoff: 2s
  reconnect_max_backoff: 60s

security:
  password_salt_rounds: 10
  expires_in: 30 # 30天有效期
  token_prefix: "zhuwo "

deployment:
  script_dir: "deploy-scripts"
  timeout: "10m"
