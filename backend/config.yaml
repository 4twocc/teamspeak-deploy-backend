# TeamSpeak 一键部署后端配置

server:
  port: "8080"
  env: "development"
  log_level: "debug"
  rate_limit:
    enabled: true
    rps: 100
    burst: 200
  auth:
    require_auth: true
    public_paths:
      - "/api/user/login"
      - "/api/user/register"
  cors:
    allowed_origins:
      - "*"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "*"
    expose_headers:
      - "X-Request-ID"
      - "X-Error-Message"
      - "X-Error-Type"
      - "X-Error-Code"
      - "X-Internal-Error"
    allow_credentials: false
  middleware:
    enable_access_log: true

database:
  driver: "sqlite"
  dsn: "data/teamspeak.db"
  max_idle_conns: 5
  max_open_conns: 10
  conn_max_lifetime: 1h
  auto_migrate: true

# 日志配置
logging:
  level: "info"                     # 日志级别: debug, info, warn, error
  output_file: "logs/system.log"    # 日志文件路径
  max_size: 100                     # 单个日志文件最大大小(MB)
  max_backups: 5                    # 保留的日志文件数量
  max_age: 30                       # 日志文件保留天数
  compress: true                    # 是否压缩旧日志文件
  retention_days: 90                # 数据库日志保留天数
  batch_size: 100                   # 批量写入数据库的日志条数
  flush_interval: 30s               # 批量写入的时间间隔
  enable_console: true              # 是否同时输出到控制台
  enable_database: true             # 是否写入数据库

monitoring:
  addr: ":9090"
  collect_interval: 1m
  min_collection_interval: 1h
  system_sample_rate: 1
  business_sample_rate: 1
  max_history_size: 24
  performance:
    collection_delay: 5s
    inter_func_delay: 600s
    inner_func_delay: 10s
  redis:
    enabled: true
    addr: "redis:6379"
    password: ""
    db: 0

teamspeak:
  host: teamspeak  # 使用docker-compose服务名而不是localhost
  query_port: 10011
  virtual_server_port: 9987
  virtual_server_id: 1
  username: serveradmin
  # password 通过环境变量 TEAMSPEAK_PASSWORD 设置
  nickname: "Monitoring Bot"
  reconnect_max_retries: 3
  reconnect_initial_backoff: 2s
  reconnect_max_backoff: 60s

security:
  password_salt_rounds: 10
  expires_in: 30 # 30天有效期
  token_prefix: "Bearer "
  
  # Cookie相关配置
  cookie_name: "auth_token"        # JWT Token的Cookie名称
  cookie_secure: true              # 仅在HTTPS下发送Cookie
  cookie_httponly: true            # 设置HttpOnly属性，防止XSS攻击
  cookie_samesite: "Strict"        # SameSite策略，防止CSRF攻击
  cookie_path: "/"                 # Cookie有效路径
  cookie_domain: ""                # Cookie域名，空字符串表示当前域名

deployment:
  script_dir: "deploy-scripts"
  timeout: "10m"
